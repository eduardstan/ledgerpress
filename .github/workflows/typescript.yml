name: TypeScript lint

on:
  push:
    branches:
      - master
      - main
    paths:
      - "web/**/*.ts"
      - "web/tsconfig.json"
      - "web/package.json"
      - "web/package-lock.json"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - ".github/workflows/typescript.yml"
  pull_request:
    paths:
      - "web/**/*.ts"
      - "web/tsconfig.json"
      - "web/package.json"
      - "web/package-lock.json"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - ".github/workflows/typescript.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run lint
