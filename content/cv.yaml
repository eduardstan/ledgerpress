  bio:
    short: >-
      Sahana Aster Kōwhai is a **fictional** palaeoclimatologist whose _research_
      reconstructs Southern Ocean change from marine sediment archives.
    long: >-
      I reconstruct how the Southern Ocean changed across abrupt climate
      transitions, combining geochemical proxies, sediment cores and
      age-depth modelling.


      My group works across oceanography, geology and _mātauranga-informed_
      environmental practice. We build open records that make uncertainty,
      provenance and field decisions visible.
  focus: >-
    Southern Ocean palaeoceanography across glacial terminations, with an
    emphasis on multiproxy reconstructions, reproducible chronology and
    equitable Antarctic field partnerships.
  footer: >-
    **Example record.** This curriculum vitae describes a fictional scholar and
    is supplied only to demonstrate the template.

